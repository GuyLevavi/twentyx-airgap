# The release gates make-release.sh enforces that need no transfer: dotfiles/
# is this commit's export, and LazyVim works with no network. On a PR from this
# repo a stale export is committed back to the branch instead of failing.
name: gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      # The pod closure plus the build tree outgrows the runner's free 14 GB.
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # check-nvim-offline.sh needs `unshare -rn`; Ubuntu 24.04's AppArmor
      # blocks unprivileged user namespaces by default.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = false

      - name: Export dotfiles
        id: export
        run: |
          ./scripts/export-dotfiles.sh
          if [ -n "$(git status --porcelain -- dotfiles)" ]; then
            git status --short -- dotfiles
            echo "stale=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the fresh export
        if: steps.export.outputs.stale == '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dotfiles
          git commit -m "dotfiles: export from $(git rev-parse --short HEAD)"
          git push

      - name: Fail on a stale export
        if: steps.export.outputs.stale == '1' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git diff --stat -- dotfiles
          echo "::error::dotfiles/ differs from a fresh export; run scripts/export-dotfiles.sh and commit"
          exit 1

      - name: LazyVim with no network
        run: ./scripts/check-nvim-offline.sh
