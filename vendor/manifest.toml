# --- tier 3: runtimes and large packs ---------------------------------------

[[artifact]]
name    = "node"
version = "22.11.0"
url     = "https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz"
sha256  = "SKIP"
dest    = "node-v22.11.0-linux-x64.tar.xz"
notes   = """
Official Node builds target a baseline x86-64 and are safe on older cluster
CPUs. This matters: the compiled OpenCode binary segfaulted because it targeted
a newer microarchitecture. pi runs as plain JS on top of this, so it is immune
to that entire class of failure.
"""

[[artifact]]
name    = "code-server"
version = "4.96.4"
url     = "https://github.com/coder/code-server/releases/download/v4.96.4/code-server-4.96.4-linux-amd64.tar.gz"
sha256  = "SKIP"
dest    = "code-server"
notes   = """
Shadows the older code-server in the internal base image. Installed to
/opt/airgap/code-server and put ahead of /usr/bin on PATH, so the base image is
never modified and reverting is just a PATH change.

CAUTION: the standalone tarball bundles its own Node at lib/node, and that
bundled build may target a newer x86-64 microarchitecture than some cluster
CPUs -- the exact failure that segfaulted OpenCode. If `code-server --version`
segfaults, swap the bundle for our vendored baseline-safe Node:

    mv  /opt/airgap/code-server/lib/node /opt/airgap/code-server/lib/node.orig
    ln -s /usr/local/bin/node /opt/airgap/code-server/lib/node

Verify this at build time, not in a pod: `airgap doctor` checks it.
"""

