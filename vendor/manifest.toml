# The closure.
#
# Every binary artifact that must cross the airgap is listed here with a sha256.
# One file fetched outside (scripts/fetch-vendor.sh), verified inside
# (libexec/airgap-vendor-verify) at build time.
#
# Rules:
#   - No build step may download anything not listed here.
#   - `sha256 = "SKIP"` disables verification for one entry. Use during
#     bring-up only; a SKIP that survives to main is a hole in the closure.
#   - Fill checksums with: scripts/fetch-vendor.sh --update-hashes
#
# `dest` is relative to the vendor dir. Anything in `bin/` is installed to
# /usr/local/bin by Containerfile.toolchain.

version = "0.1.0"

# --- tier 1: first transfer -------------------------------------------------
# Deliberately small. Proves manifest -> transfer -> verify -> append end to end
# before committing to a 2GB round trip.

[[artifact]]
name    = "crane"
version = "0.20.2"
url     = "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz"
sha256  = "SKIP"
dest    = "bin/crane"
extract = "crane"
notes   = "Registry-side layer append. Without this the pytorch image build cannot run."

