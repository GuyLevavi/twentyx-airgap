set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1
set -g status-keys vi
set -g mode-keys   vi
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix
set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize on
setw -g clock-mode-style  24
set  -s escape-time       0
set  -g history-limit     50000

# A tmux server started from fish inherits BASH_EXECS_FISH, so every new
# window's bash sees the marker and skips its exec-into-fish -- panes opened
# as bash. default-shell spawns fish directly.
set -g default-shell /opt/twentyx/profile/bin/fish

# extkeys: ask the outer terminal (WezTerm, Zed) for modifyOtherKeys, so
# Shift/Ctrl+Enter reach tmux as distinct keys instead of a plain CR.
set -as terminal-features ",*:RGB:extkeys"
# always + csi-u: forward those keys to every pane as CSI u (`\e[13;2u` for
# Shift+Enter). `on` sends them only to apps that request modifyOtherKeys;
# opencode asks for the kitty protocol, which tmux does not speak, so it got a
# plain CR and Shift+Enter submitted. Unmodified keys and C-<letter> are
# unchanged (tested: C-a C-r Enter Tab arrive as 001 022 \r \t).
set -g extended-keys always
set -g extended-keys-format csi-u
# OSC 52 clipboard. This is the only way a yank inside a RunAI pod reaches the
# Windows clipboard: there is no X11, no Wayland, and no wl-copy to forward to.
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g renumber-windows on
set -g display-time 4000
set -g status-interval 5
bind C-p previous-window
bind C-n next-window
bind R source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# copy-mode vi
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# splits + pane nav
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# structure -- Tokyo Night, static: there is no Noctalia in the gap.
set -g status-position top
set -g status-justify left
setw -g window-status-separator ""
set -g pane-border-lines heavy
set -g pane-border-indicators colour
setw -g window-status-format ' #I:#W#{?@workmux_status, #{@workmux_status},}#{?window_flags,#{window_flags}, } '
setw -g window-status-current-format ' #I:#W#{?@workmux_status, #{@workmux_status},}#{?window_flags,#{window_flags}, } '
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7,nobold]"
set -g status-right "#[fg=#565f89]#h #[fg=#7aa2f7]%H:%M "
setw -g window-status-style "fg=#565f89,bg=#1a1b26"
setw -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"
set -g message-style "bg=#414868,fg=#a9b1d6"
set -g mode-style "bg=#7aa2f7,fg=#1a1b26"
setw -g clock-mode-colour "#bb9af7"
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g popup-style "bg=#1a1b26,fg=#a9b1d6"
set -g popup-border-style "fg=#414868"

# workmux: status_format is off in its config.yaml, so this format owns the
# bar; @workmux_status is the per-window agent icon it sets.
bind C-s display-popup -E -h 80% -w 90% "workmux dashboard"
bind Tab run-shell "workmux last-agent"
bind w run-shell "workmux last-done"
