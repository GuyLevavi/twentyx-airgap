# Runs INSIDE the airgap. Assembles images without ever pulling a pytorch base.
#
# What changed with the move to Nix: this pipeline no longer *builds* the
# toolchain. The closure is computed and built outside, carried in as two
# tarballs, and pushed to Artifactory once per transfer. CI's job is to fetch
# them, build the one layer that genuinely needs a registry (npm), and append.
#
#   nix-layer-nvim.tar.gz  from the transfer, via Artifactory   monthly
#     (+ -delta.tar.gz)    appended above it, when the transfer was a delta
#   node-layer.tar         built here, needs Artifactory npm    monthly
#   repo-layer.tar         plain tar of this checkout           every commit
#
# The pytorch bases are never pulled, so this runs in a small pod and does not
# hit the ephemeral-storage limit that kills `FROM base-pytorch`.

stages: [lint, build, assemble]

variables:
  AIRGAP_REGISTRY: "$CI_REGISTRY_IMAGE"
  AIRGAP_BASE_REGISTRY: "quay.internal/ai"      # TODO: real path, see NOTES.md
  AIRGAP_BASE_TAG: "latest"
  AIRGAP_VARIANTS: "base-slim base-pytorch vscode-slim vscode-pytorch"
  # Where push-artifactory.sh put the transferred layers. BASE holds the last
  # full nix layers; DELTA, when set, the delta layers appended above them
  # (scripts/build-layers.sh --since). Unset DELTA once a full transfer
  # replaces the base.
  LAYER_BASE_URL: "$ARTIFACTORY_URL/generic-local/airgap/0.1.0"
  LAYER_DELTA_URL: "$ARTIFACTORY_URL/generic-local/airgap/0.2.1"
  # Optional. The runai CLI binary as the control plane serves it (look inside
  # the installer the UI hands you under Help > Researcher Command Line
  # Interface for the URL). Fetched every build, so it tracks the cluster.
  RUNAI_CLI_URL: ""

# The nix layer, plus its delta when LAYER_DELTA_URL is set. Both jobs need
# the same stack: the node layer is built against what the image will run.
# A corrupted transfer must fail here, not in a pod three days later.
.fetch-nix-layers: &fetch_nix_layers
  - |
      mkdir -p dist
      fetch() {
        curl -fSL -H "Authorization: Bearer $ARTIFACTORY_TOKEN" -o "dist/$2" "$1/$2"
        if curl -fsSL -H "Authorization: Bearer $ARTIFACTORY_TOKEN" -o "dist/$2.sha256" "$1/$2.sha256"; then
          ( cd dist && sha256sum -c "$2.sha256" )
        else
          echo "warn: no $2.sha256 in Artifactory; cannot verify the transfer" >&2
        fi
      }
      fetch "$LAYER_BASE_URL" nix-layer-nvim.tar.gz
      if [ -n "${LAYER_DELTA_URL:-}" ]; then
        fetch "$LAYER_DELTA_URL" nix-layer-nvim-delta.tar.gz
      fi

# ---------------------------------------------------------------------------
lint:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck -S warning bin/airgap libexec/airgap-* scripts/*.sh docker/*.sh
  rules:
    - changes: [bin/**/*, libexec/**/*, scripts/**/*, docker/**/*]

# ---------------------------------------------------------------------------
# The only stage that still needs a container build, and the only one that
# needs a package registry: pi ships as an npm package.
#
# node itself now comes from the Nix layer, so this fetches it too -- and that
# doubles as a check that the transferred layer is intact before anything is
# pushed to a registry under a tag people will pull.
node-layer:
  stage: build
  image: gcr.io/kaniko-project/executor:debug   # or buildah/docker, per platform
  script:
    - *fetch_nix_layers
    - |
      docker buildx build \
        -f docker/Containerfile.node \
        --build-arg BASE_IMAGE="$AIRGAP_BASE_REGISTRY/base-slim:$AIRGAP_BASE_TAG" \
        --build-arg NPM_REGISTRY="$ARTIFACTORY_URL/api/npm/npm-local/" \
        --cache-from type=registry,ref=$AIRGAP_REGISTRY:buildcache \
        --cache-to   type=registry,ref=$AIRGAP_REGISTRY:buildcache,mode=max \
        --target export -o type=tar,dest=dist/node-layer.tar .
    - ls -lh dist/node-layer.tar
  artifacts:
    paths: [dist/node-layer.tar]
    expire_in: 1 day

# ---------------------------------------------------------------------------
# Registry-side append. Seconds per variant: each blob is uploaded once and
# cross-mounted for the rest.
assemble:
  stage: assemble
  needs: [node-layer]
  # Only needs crane, jq, tar and the artifacts; the slim base is plenty.
  image: "$AIRGAP_BASE_REGISTRY/base-slim:$AIRGAP_BASE_TAG"
  script:
    - *fetch_nix_layers
    # Built here rather than carried: it is 80KB of this very checkout, and
    # rebuilding it is what makes a config change a one-commit deploy.
    - ./docker/mklayer.sh dist/repo-layer.tar
    - |
      if [ -n "$RUNAI_CLI_URL" ]; then
        if curl -fSL -o dist/runai "$RUNAI_CLI_URL"; then
          chmod +x dist/runai
          ./dist/runai version || echo "warn: runai version failed; shipping it anyway" >&2
        else
          echo "warn: runai CLI fetch failed; images ship without it" >&2
          rm -f dist/runai
        fi
      fi
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - ./docker/assemble.sh "$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
