# Runs INSIDE the airgap. Assembles images without ever pulling a pytorch base.
#
# This pipeline does not build the toolchain. The closure is built outside and
# published once per transfer to this project's GitLab generic package
# registry as twentyx-store/<RELEASE>/ (scripts/push-gitlab-packages.sh);
# STORE_RELEASE pins the release this repo uses. CI tars this checkout as the
# repo layer and appends it registry-side:
#
#   workspace-store:<release>-<variant>-<base digest>   once per release
#   workspace:<commit>-<variant>                         every commit (~400 KB)
#
# docker/assemble.sh fetches the ~1 GB store layers only when the store image
# for this release and base is missing, so a config commit downloads nothing
# big. The pytorch bases are never pulled, so this runs in a small pod and does
# not hit the ephemeral-storage limit that kills `FROM base-pytorch`.

stages: [assemble, smoke]

# Every cluster fact below is a DEFAULT. The airgap's GitLab sets the real
# ones as project/group CI variables, which beat this file.
variables:
  IMAGE_REGISTRY: "$CI_REGISTRY_IMAGE"
  BASE_REGISTRY: "quay.internal/ai"
  BASE_TAG: "latest"
  IMAGE_VARIANTS: "base-slim base-pytorch vscode-slim vscode-pytorch"

# ---------------------------------------------------------------------------
# Registry-side append. Seconds per variant once the store image exists.
assemble:
  stage: assemble
  # Only needs crane, jq, curl and tar; the slim base is plenty.
  image: "$BASE_REGISTRY/base-slim:$BASE_TAG"
  script:
    - ./docker/mklayer.sh dist/repo-layer.tar
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - ./docker/assemble.sh "$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# The image this commit just built IS the job image: doctor checks the closure,
# the setuid sudo, $HOME links and the boot chain (a runner without working sudo
# is only a note), and shellcheck (from the closure) lints the scripts.
# No Docker Hub image needed.
smoke:
  stage: smoke
  image:
    name: "$CI_REGISTRY_IMAGE/workspace:$CI_COMMIT_SHORT_SHA-base-slim"
    entrypoint: [""]
  variables:
    # A CI pod has no PVC; an explicit home counts as durable for doctor.
    SESSION_HOME: "/tmp/smoke-home"
  script:
    - /opt/twentyx/libexec/entrypoint doctor
    - shellcheck -S warning pod/* wsl/*.sh docker/*.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
