# Runs INSIDE the airgap. Assembles images without ever pulling a pytorch base.
#
# This pipeline does not build the toolchain. The closure is computed and
# built outside, carried in as two tarballs, and pushed to Artifactory once
# per transfer. CI's job is to fetch them, tar this checkout as the repo
# layer, and append.
#
#   nix-layer.tar.gz       from the transfer, via Artifactory   monthly
#   repo-layer.tar         plain tar of this checkout           every commit
#
# The pytorch bases are never pulled, so this runs in a small pod and does not
# hit the ephemeral-storage limit that kills `FROM base-pytorch`.

stages: [lint, assemble]

variables:
  IMAGE_REGISTRY: "$CI_REGISTRY_IMAGE"
  BASE_REGISTRY: "quay.internal/ai"      # TODO: real path, see NOTES.md
  BASE_TAG: "latest"
  IMAGE_VARIANTS: "base-slim base-pytorch vscode-slim vscode-pytorch"
  # Where push-artifactory.sh put the transferred layers.
  LAYER_BASE_URL: "$ARTIFACTORY_URL/generic-local/airgap/0.1.0"

# ---------------------------------------------------------------------------
lint:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck -S warning libexec/airgap-* agent/*.sh tests/*.sh scripts/*.sh docker/*.sh
  rules:
    - changes: [libexec/**/*, agent/**/*, tests/**/*, scripts/**/*, docker/**/*]

# ---------------------------------------------------------------------------
# Registry-side append. Seconds per variant: each blob is uploaded once and
# cross-mounted for the rest.
assemble:
  stage: assemble
  # Only needs crane, jq, tar and the artifacts; the slim base is plenty.
  image: "$BASE_REGISTRY/base-slim:$BASE_TAG"
  script:
    - |
      # The plain layer is a hard requirement; the nvim flavor is optional
      # (a transfer without it must not fail CI -- assemble.sh copes).
      curl -fSL -H "Authorization: Bearer $ARTIFACTORY_TOKEN" \
        -o dist/nix-layer.tar.gz "$LAYER_BASE_URL/nix-layer.tar.gz"
      curl -fSL -H "Authorization: Bearer $ARTIFACTORY_TOKEN" \
        -o dist/nix-layer-nvim.tar.gz "$LAYER_BASE_URL/nix-layer-nvim.tar.gz" ||
        echo "note: nix-layer-nvim.tar.gz not in Artifactory -- plain flavor only"
    # Built here rather than carried: it is 80KB of this very checkout, and
    # rebuilding it is what makes a script change a one-commit deploy.
    - ./docker/mklayer.sh dist/repo-layer.tar
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - ./docker/assemble.sh "$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
